name: Infra CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_DB=artbridge
          POSTGRES_USER=ab_admin
          POSTGRES_PASSWORD=dummy-password
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin123
          MINIO_BUCKET=photos
          PUBLIC_MEDIA_BASE_URL=http://localhost/media
          EOF

      - name: Validate compose file
        run: docker compose --env-file .env.ci config

      - name: Validate nginx config
        run: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:1.27-alpine nginx -t