name: Infra CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env.ci <<EOF
          POSTGRES_DB=artbridge
          POSTGRES_USER=artbridge
          POSTGRES_PASSWORD=artbridge
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_BUCKET=photos
          PUBLIC_MEDIA_BASE_URL=http://localhost/media
          EOF

      - name: Validate compose file
        run: docker compose -f docker-compose.ci.yml --env-file .env.ci config

      - name: Build and start services
        run: docker compose -f docker-compose.ci.yml --env-file .env.ci up -d

      - name: Validate nginx config inside container
        run: docker compose -f docker-compose.ci.yml --env-file .env.ci exec -T nginx nginx -t

      - name: Wait for services
        run: sleep 10

      - name: Check frontend through nginx
        run: curl -f http://localhost/

      - name: Check backend through nginx
        run: curl -f http://localhost/api/health

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml --env-file .env.ci logs --tail=200 nginx
          docker compose -f docker-compose.ci.yml --env-file .env.ci logs --tail=200 backend
          docker compose -f docker-compose.ci.yml --env-file .env.ci logs --tail=200 frontend
          docker compose -f docker-compose.ci.yml --env-file .env.ci logs --tail=200 postgres
          docker compose -f docker-compose.ci.yml --env-file .env.ci logs --tail=200 minio

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml --env-file .env.ci down -v
