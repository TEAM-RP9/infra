name: Infra CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env.ci <<EOF
          POSTGRES_DB=artbridge
          POSTGRES_USER=artbridge
          POSTGRES_PASSWORD=artbridge
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_BUCKET=photos
          PUBLIC_MEDIA_BASE_URL=http://localhost/media
          EOF

      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: TEAM-RP9/art-bridge-backend
          path: art-bridge-backend

      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: TEAM-RP9/art-bridge-client
          path: art-bridge-client

      - name: Symlink repos to sibling paths compose expects
        run: |
          ln -s $GITHUB_WORKSPACE/art-bridge-backend $(dirname $GITHUB_WORKSPACE)/art-bridge-backend
          ln -s $GITHUB_WORKSPACE/art-bridge-client $(dirname $GITHUB_WORKSPACE)/art-bridge-client

      - name: Validate compose file
        run: docker compose --env-file .env.ci config

      - name: Build and start services
        run: docker compose --env-file .env.ci up -d --build postgres minio backend frontend nginx

      - name: Validate nginx config inside container
        run: docker compose --env-file .env.ci exec -T nginx nginx -t

      - name: Wait a bit for services
        run: sleep 15

      - name: Check frontend through nginx
        run: curl -f http://localhost/

      - name: Check backend health through nginx
        run: curl -f http://localhost/api/actuator/health

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose --env-file .env.ci logs --tail=200 nginx
          docker compose --env-file .env.ci logs --tail=200 backend
          docker compose --env-file .env.ci logs --tail=200 frontend
          docker compose --env-file .env.ci logs --tail=200 postgres
          docker compose --env-file .env.ci logs --tail=200 minio

      - name: Tear down
        if: always()
        run: docker compose --env-file .env.ci down -v
