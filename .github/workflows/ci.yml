name: Infra CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra repo
        uses: actions/checkout@v4

      - name: Create CI env file
        run: |
          cat > .env.ci <<EOF
          POSTGRES_DB=artbridge
          POSTGRES_USER=artbridge
          POSTGRES_PASSWORD=artbridge
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_BUCKET=photos
          PUBLIC_MEDIA_BASE_URL=http://localhost/media
          EOF

      - name: Validate docker-compose syntax
        run: docker compose --env-file .env.ci config

      - name: Validate nginx config (syntax only)
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine \
            sh -c "nginx -t || exit 1"